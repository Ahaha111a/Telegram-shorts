<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030407"><title>Telegram Shorts</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#030407;--panel:#0a0d13;--glass:#101522cc;--line:#ffffff14;--muted:#8f98aa;--text:#f7f8ff;--a:#8a5cff;--b:#19a7ff;--pink:#e94cff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{overflow:hidden}button,input{font:inherit}.app{height:100dvh;position:relative;background:radial-gradient(circle at 50% -10%,#18213a 0,#030407 38%)}.top{position:fixed;z-index:30;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#030407e8,transparent);pointer-events:none}.brand{font-weight:900;font-size:18px;letter-spacing:-.5px}.brand span{background:linear-gradient(90deg,#fff,#9b70ff,#26b8ff);-webkit-background-clip:text;color:transparent}.top-actions{display:flex;gap:8px;pointer-events:auto}.feed-switch{position:fixed;z-index:35;top:calc(env(safe-area-inset-top) + 58px);left:16px;right:16px;display:grid;grid-template-columns:1fr 1fr;padding:3px;border:1px solid #ffffff16;border-radius:17px;background:#080b11b8;backdrop-filter:blur(18px);box-shadow:0 10px 35px #0005;overflow:hidden}.feed-switch:before{content:"";position:absolute;z-index:-1;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:14px;background:linear-gradient(100deg,#9b3dff,#765cff,#18aafc);box-shadow:0 7px 22px #754cff55;transform:translateX(0);transition:transform .42s cubic-bezier(.22,.8,.2,1)}.feed-switch.following:before{transform:translateX(100%)}.feed-switch button{border:0;border-radius:14px;background:transparent;color:#8f98aa;padding:10px 8px;font-weight:750;font-size:13px;transition:color .28s}.feed-switch button.active{color:#fff}.feed-switch.switching:before{filter:saturate(.9);opacity:.9}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.report-option{border:1px solid var(--line);border-radius:14px;background:#ffffff08;color:#dce1ec;padding:11px;text-align:left}.report-option.active{border-color:#8f61ff;background:#7b4cff20}.admin-item{padding:12px;border:1px solid var(--line);border-radius:16px;background:#ffffff06;margin-bottom:8px}.admin-actions{display:flex;gap:8px;margin-top:9px}.admin-actions button{flex:1}.danger{border:1px solid #ff526055!important;background:#ff355d12!important;color:#ff8096!important}.icon{width:38px;height:38px;border:1px solid var(--line);border-radius:13px;background:#0d1119b8;color:#fff;backdrop-filter:blur(14px)}.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.slide{position:relative;height:100dvh;min-height:100dvh;scroll-snap-align:start;background:#06080c;overflow:hidden}.video{width:100%;height:100%;object-fit:cover;background:#07090e}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0005 0%,transparent 30%,#0002 55%,#000d 100%);pointer-events:none}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px #0008;pointer-events:none}.side{position:absolute;right:12px;bottom:108px;display:flex;flex-direction:column;gap:10px;align-items:center}.action{width:48px;min-height:48px;border:1px solid #ffffff18;border-radius:17px;background:#080b12b8;color:#fff;backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 8px 25px #0005}.action.liked{background:linear-gradient(145deg,#8b35ff,#e63b9d);border-color:#ffffff30}.action.saved{background:linear-gradient(145deg,#284cff,#18aafc);border-color:#ffffff30}.feed-loading{position:fixed;z-index:36;top:calc(env(safe-area-inset-top) + 108px);left:50%;transform:translateX(-50%);padding:6px 10px;border:1px solid #ffffff14;border-radius:999px;background:#080b11cc;backdrop-filter:blur(14px);font-size:11px;color:#dce2ee;opacity:0;pointer-events:none;transition:opacity .2s}.feed-loading.show{opacity:1}.profile-links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:10px 0}.profile-link{border:1px solid var(--line);border-radius:13px;background:#ffffff07;color:#dce2ec;padding:9px 5px;font-size:11px}.tag{display:inline-block;color:#a98bff;margin:6px 5px 0 0;font-size:12px}.people-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.people-row .avatar{width:42px;height:42px}.people-row button{margin-left:auto}.edit-hint{font-size:11px;color:var(--muted);margin-top:4px}.action span:first-child{font-size:19px}.count{font-size:10px;color:#d7d9e1}.meta{position:absolute;left:16px;right:76px;bottom:96px;z-index:3;text-shadow:0 2px 12px #000}.author{font-weight:850;font-size:15px;margin-bottom:8px}.follow-mini{margin-left:8px;border:1px solid #ffffff2b;border-radius:999px;background:#ffffff12;color:#fff;padding:5px 9px;font-size:10px}.caption{font-size:14px;line-height:1.4;color:#f0f1f5}.sound{margin-top:9px;font-size:11px;color:#c8ceda}.bottom{position:fixed;z-index:40;bottom:0;left:0;right:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;background:linear-gradient(transparent,#030407f2 38%);backdrop-filter:blur(8px)}.nav{border:0;background:transparent;color:#8f98aa;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav.active{color:#fff}.nav.plus{width:48px;height:48px;margin:-10px auto 0;border-radius:17px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 28px #6b4dff66;font-size:23px}.nav small{font-size:10px}.panel{position:fixed;z-index:80;left:0;right:0;bottom:0;max-height:88dvh;background:linear-gradient(180deg,#0b0e16f7,#05070bf9);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -30px 90px #000b;backdrop-filter:blur(24px);overflow:auto}.panel.open{transform:translateY(0)}.handle{width:42px;height:4px;border-radius:99px;background:#fff2;margin:0 auto 16px}.panel-title{font-size:20px;font-weight:850;margin-bottom:14px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-head .panel-title{margin:0}.panel-close{width:38px;height:38px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}.field{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:16px;background:#080b11;color:#fff;outline:none;margin:7px 0}.primary{width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(100deg,#8b3cff,#6f63ff,#18aafc);color:#fff;font-weight:850;margin-top:8px;box-shadow:0 12px 35px #6c43ff35}.secondary{width:100%;padding:12px;border:1px solid var(--line);border-radius:16px;background:#ffffff08;color:#fff;margin-top:8px}.status{font-size:12px;color:var(--muted);min-height:18px;margin-top:8px}.profile-head{display:flex;gap:14px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#161c2a,#07090e);border:1px solid #ffffff20}.stats{display:flex;gap:7px;margin-top:10px;font-size:12px;color:#aeb6c6}.profile-stat{flex:1;border:1px solid var(--line);border-radius:13px;background:#ffffff06;color:#dce2ec;padding:8px 4px;display:flex;flex-direction:column;gap:2px}.profile-stat span{font-size:10px;color:var(--muted)}.bio{color:#aeb6c6;font-size:13px;margin:12px 0}.profile-actions{display:flex;gap:8px}.profile-actions button{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:14px}.grid video{width:100%;aspect-ratio:9/14;object-fit:cover;background:#111;border-radius:5px}.searchbox{display:flex;gap:8px}.searchbox input{flex:1}.result{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.result .avatar{width:42px;height:42px}.result button{margin-left:auto;border:1px solid #ffffff18;border-radius:12px;background:#111826;color:#fff;padding:8px 11px}.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.comment .avatar{width:36px;height:36px}.comment b{font-size:12px}.comment p{margin:3px 0 0;color:#d6dae4;font-size:13px}.empty,.loading{height:100%;display:flex;align-items:center;justify-content:center;padding:35px;text-align:center;color:#9aa3b3}.toast{position:fixed;z-index:120;left:50%;bottom:85px;transform:translateX(-50%) translateY(20px);opacity:0;background:#111722ee;border:1px solid var(--line);padding:10px 14px;border-radius:14px;font-size:12px;transition:.2s;backdrop-filter:blur(16px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><div class="app"><div class="top"><div class="brand">Telegram <span>Shorts</span></div><div class="top-actions"><button class="icon" id="searchBtn">⌕</button><button class="icon" id="profileBtn">◯</button></div></div><div class="feed-switch"><button id="recommendedTab" class="active">✦ Для тебя</button><button id="followingTab">♡ Подписки</button></div><main id="feed" class="feed"><div class="loading">Загрузка…</div></main><div id="feedLoading" class="feed-loading">Обновляем ленту…</div><nav class="bottom"><button class="nav active" data-nav="home">⌂<small>Главная</small></button><button class="nav" data-nav="search">⌕<small>Поиск</small></button><button class="nav plus" id="uploadBtn">＋</button><button class="nav" data-nav="notify" style="position:relative">♧<small>События</small><span id="notifyBadge" style="display:none;position:absolute;top:-1px;right:18%;min-width:15px;height:15px;padding:0 4px;border-radius:99px;background:#e94cff;color:#fff;font-size:9px;line-height:15px">0</span></button><button class="nav" data-nav="profile">◯<small>Профиль</small></button></nav>
<div class="panel" id="uploadPanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">Создать Shorts</div><button class="panel-close" aria-label="Закрыть">×</button></div><input id="videoFile" class="field" type="file" accept="video/mp4,video/webm,video/quicktime"><input id="caption" class="field" maxlength="500" placeholder="Расскажи, что происходит в видео…"><button id="publishBtn" class="primary">Опубликовать</button><button class="secondary close-panel">Отмена</button><div id="uploadStatus" class="status"></div></div>
<div class="panel" id="profilePanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">Профиль</div><button class="panel-close" aria-label="Закрыть">×</button></div><div id="profileContent">Загрузка…</div><button class="secondary close-panel">Закрыть</button></div>

<div class="panel" id="commentsPanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">Комментарии</div><button class="panel-close" aria-label="Закрыть">×</button></div><div id="commentsList"></div><div class="searchbox"><input id="commentInput" class="field" maxlength="500" placeholder="Написать комментарий…"><button id="commentSend" class="icon" style="margin-top:7px">➤</button></div></div>
<div class="panel" id="notifyPanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">События</div><button class="panel-close" aria-label="Закрыть">×</button></div><div id="notifyList">Загрузка…</div></div><div class="panel" id="reportPanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">Пожаловаться</div><button class="panel-close" aria-label="Закрыть">×</button></div><div class="status">Выберите причину жалобы</div><div class="report-grid"><button class="report-option" data-reason="spam">Спам</button><button class="report-option" data-reason="violence">Насилие</button><button class="report-option" data-reason="sexual">Сексуальный контент</button><button class="report-option" data-reason="harassment">Травля</button><button class="report-option" data-reason="copyright">Авторские права</button><button class="report-option" data-reason="other">Другое</button></div><input id="reportDetails" class="field" maxlength="500" placeholder="Дополнительная информация (необязательно)"><button id="reportSend" class="primary">Отправить жалобу</button></div>
<div class="panel" id="adminPanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">🛡 Модерация</div><button class="panel-close" aria-label="Закрыть">×</button></div><div id="adminContent">Загрузка…</div></div>
<div class="panel" id="savedPanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">Сохранённые</div><button class="panel-close" aria-label="Закрыть">×</button></div><div id="savedList">Загрузка…</div></div>
<div class="panel" id="peoplePanel"><div class="handle"></div><div class="panel-head"><div class="panel-title" id="peopleTitle">Люди</div><button class="panel-close" aria-label="Закрыть">×</button></div><div id="peopleList">Загрузка…</div></div>
<div class="panel" id="editProfilePanel"><div class="handle"></div><div class="panel-head"><div class="panel-title">Редактировать профиль</div><button class="panel-close" aria-label="Закрыть">×</button></div><div class="status">Изменить можно только описание. Имя и username берутся из Telegram.</div><textarea id="editBio" class="field" maxlength="160" rows="5" placeholder="Расскажи о себе…" style="resize:none"></textarea><button id="saveProfileBtn" class="primary">Сохранить</button><div id="profileSaveStatus" class="status"></div></div>
<div id="toast" class="toast"></div></div>
<script><script>
const tg=window.Telegram?.WebApp,feed=document.getElementById('feed');
let initData='',viewed=new Set(),currentCommentVideo=null,currentReportVideo=null,currentReportReason=null,currentFeedMode='recommended',me=null;
let feedRequestToken=0,feedOffset=0,feedHasMore=true,feedLoading=false,feedFirstLoad=true,profileRequestToken=0;
const $=id=>document.getElementById(id); const headers=(x={})=>({'X-Telegram-Init-Data':initData,...x});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function openPanel(id){closePanels();$(id).classList.add('open');if(tg?.BackButton)tg.BackButton.show()}
function closePanels(){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));if(tg?.BackButton)tg.BackButton.hide()}
async function auth(){if(!tg)throw Error('Откройте приложение через Telegram.');tg.ready();tg.expand();initData=tg.initData||'';if(!initData)throw Error('Откройте Mini App через бота заново.');let r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Ошибка авторизации');me=d.user||null;let mr=await fetch('/api/me',{headers:headers()}),md=await mr.json();if(mr.ok&&md.ok){me=md.user||me;me.is_admin=!!md.is_admin}}
function setFeedMode(mode){currentFeedMode=mode;const sw=document.querySelector('.feed-switch');sw.classList.toggle('following',mode==='following');document.querySelectorAll('.feed-switch button').forEach(b=>b.classList.remove('active'));$(mode==='following'?'followingTab':'recommendedTab').classList.add('active')}
function setFeedLoading(show){$('feedLoading').classList.toggle('show',show)}
function hashtagHtml(tags){return (tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
function renderFeed(vs,{append=false}={}){
 if(!append && !vs.length){feed.innerHTML='<div class="empty">Пока нет видео.<br><br>Нажми ＋ и опубликуй первое Shorts.</div>';return}
 const html=vs.map(v=>`<section class="slide" data-id="${v.id}"><video class="video" src="${esc(v.video_url)}" playsinline muted loop preload="metadata"></video><div class="shade"></div><div class="vignette"></div><div class="side"><button class="action like-btn ${v.liked?'liked':''}" data-id="${v.id}">♥<span class="count like-count">${v.likes_count||0}</span></button><button class="action save-btn ${v.saved?'saved':''}" data-id="${v.id}">▣<span class="count">${v.saved?'Сохр.':'Сохранить'}</span></button><button class="action comment-btn" data-id="${v.id}">◌<span class="count">${v.comments_count||0}</span></button><button class="action report-btn" data-id="${v.id}">⋯<span class="count">Ещё</span></button><button class="action view-btn" data-id="${v.id}">↗<span class="count">${v.views_count||0}</span></button></div><div class="meta"><div class="author"><button class="author-link" data-user="${v.user_id}" style="border:0;background:none;color:#fff;padding:0;font-weight:850">@${esc(v.username||v.first_name||'user')}</button> ${Number(me?.id)===Number(v.user_id)?'':`<button class="follow-mini" data-user="${v.user_id}">${v.following?'Вы подписаны':'Подписаться'}</button>`}</div><div class="caption">${esc(v.caption||'')}</div><div>${hashtagHtml(v.hashtags)}</div><div class="sound">♪ Original sound · Telegram Shorts</div></div></section>`).join('');
 if(append){feed.insertAdjacentHTML('beforeend',html)}else{feed.innerHTML=html}
 bindFeed();
}
function bindFeed(){
 document.querySelectorAll('.video').forEach(v=>v.onclick=()=>v.paused?v.play():v.pause());
 document.querySelectorAll('.like-btn').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(b.disabled)return;b.disabled=true;try{let r=await fetch('/api/videos/'+b.dataset.id+'/like',{method:'POST',headers:headers()}),d=await r.json();if(d.ok){b.classList.toggle('liked',d.liked);b.querySelector('.like-count').textContent=d.likes_count}}finally{b.disabled=false}});
 document.querySelectorAll('.save-btn').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(b.disabled)return;b.disabled=true;try{let r=await fetch('/api/videos/'+b.dataset.id+'/save',{method:'POST',headers:headers()}),d=await r.json();if(d.ok){b.classList.toggle('saved',d.saved);b.querySelector('.count').textContent=d.saved?'Сохр.':'Сохранить';toast(d.saved?'Видео сохранено':'Видео убрано из сохранённых')}}finally{b.disabled=false}});
 document.querySelectorAll('.comment-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();currentCommentVideo=b.dataset.id;openComments(currentCommentVideo)});
 document.querySelectorAll('.report-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();currentReportVideo=b.dataset.id;currentReportReason=null;document.querySelectorAll('.report-option').forEach(x=>x.classList.remove('active'));openPanel('reportPanel')});
 document.querySelectorAll('.follow-mini').forEach(b=>b.onclick=async e=>{e.stopPropagation();let r=await fetch('/api/users/'+b.dataset.user+'/follow',{method:'POST',headers:headers()}),d=await r.json();if(d.ok){b.textContent=d.following?'Вы подписаны':'Подписаться';toast(d.following?'Подписка оформлена':'Подписка отменена')}});
 document.querySelectorAll('.author-link').forEach(b=>b.onclick=e=>{e.stopPropagation();openPanel('profilePanel');loadProfile(Number(b.dataset.user))});
 const ob=new IntersectionObserver(es=>es.forEach(e=>{let v=e.target.querySelector('.video'),id=e.target.dataset.id;if(e.isIntersecting&&e.intersectionRatio>.7){v.play().catch(()=>{});if(!viewed.has(id)){viewed.add(id);fetch('/api/videos/'+id+'/view',{method:'POST',headers:headers()}).then(r=>r.json()).then(d=>{let c=e.target.querySelector('.view-btn .count');if(d.ok&&c)c.textContent=d.views_count})}}else v.pause()}),{threshold:[.7]});document.querySelectorAll('.slide').forEach(x=>ob.observe(x));
}
async function loadFeed(mode=currentFeedMode,{reset=true}={}){
 const token=++feedRequestToken;setFeedMode(mode);feedHasMore=true;if(reset)feedOffset=0;
 if(feedFirstLoad&&!feed.children.length)feed.innerHTML='<div class="loading">Загрузка…</div>';
 feedFirstLoad=false;feedLoading=true;setFeedLoading(true);document.querySelector('.feed-switch').classList.add('switching');
 try{let r=await fetch('/api/feed?mode='+encodeURIComponent(mode)+'&limit=30&offset='+feedOffset,{headers:headers()});let d=await r.json();if(token!==feedRequestToken)return;if(!r.ok||!d.ok)throw Error(d.detail||d.error||'Не удалось загрузить ленту');
   feedHasMore=(d.videos||[]).length>=30;if(reset){renderFeed(d.videos);feedOffset=d.videos.length;feed.scrollTo({top:0,behavior:'auto'})}else{renderFeed(d.videos,{append:true});feedOffset+=d.videos.length}
 }finally{if(token===feedRequestToken){feedLoading=false;setFeedLoading(false);document.querySelector('.feed-switch').classList.remove('switching')}}
}
async function loadMoreIfNeeded(){if(feedLoading||!feedHasMore)return;let near=feed.scrollTop+feed.clientHeight>=feed.scrollHeight-900;if(near){const token=feedRequestToken;feedLoading=true;setFeedLoading(true);try{let mode=currentFeedMode,r=await fetch('/api/feed?mode='+encodeURIComponent(mode)+'&limit=30&offset='+feedOffset,{headers:headers()}),d=await r.json();if(token!==feedRequestToken)return;if(!r.ok||!d.ok)throw Error(d.detail||'Не удалось загрузить ещё видео');feedHasMore=(d.videos||[]).length>=30;renderFeed(d.videos,{append:true});feedOffset+=d.videos.length}catch(e){if(token===feedRequestToken)toast(e.message)}finally{if(token===feedRequestToken){feedLoading=false;setFeedLoading(false)}}}}
async function loadProfile(userId=null){let token=++profileRequestToken,url=userId?'/api/profile/'+userId:'/api/me';let r=await fetch(url,{headers:headers()}),d=await r.json();if(token!==profileRequestToken)return;if(!r.ok||!d.ok)throw Error(d.detail||'Ошибка профиля');let u=d.user,avatar=u.avatar_url?`<img class="avatar" src="${esc(u.avatar_url)}">`:'<div class="avatar"></div>';let vids=d.videos||[];$('profileContent').innerHTML=`<div class="profile-head">${avatar}<div><b>${esc(((u.first_name||'')+' '+(u.last_name||'')).trim()||'Пользователь')}</b><div class="status">@${esc(u.username||'username')}</div></div></div><div class="stats"><button class="profile-stat" data-type="followers"><b>${u.followers_count}</b><span>подписчиков</span></button><button class="profile-stat" data-type="following"><b>${u.following_count}</b><span>подписок</span></button><button class="profile-stat" data-type="videos"><b>${u.videos_count}</b><span>видео</span></button></div><div class="bio">${esc(u.bio||'Создаю и смотрю короткие видео.')}</div>${!userId?`<div class="profile-actions"><button class="secondary" id="editProfileBtn">Редактировать</button><button class="secondary" id="savedOpenBtn">Сохранённые</button></div>`:`<div class="profile-actions"><button class="primary" id="profileFollow">${u.following?'Вы подписаны':'Подписаться'}</button></div>`}<div class="grid">${vids.map(v=>`<div><video src="${esc(v.video_url)}" muted playsinline controls preload="metadata"></video>${!userId&&me&&Number(me.id)===Number(u.id)?`<button class="secondary delete-video" data-id="${v.id}" style="margin-top:3px;font-size:10px;padding:7px">Удалить</button>`:''}</div>`).join('')}</div>${!vids.length?'<div class="status">Пока нет опубликованных видео.</div>':''}`;
 document.querySelectorAll('.profile-stat').forEach(b=>b.onclick=()=>b.dataset.type==='videos'?null:loadPeople(Number(u.id),b.dataset.type));
 document.querySelectorAll('.delete-video').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить это видео?'))return;let r=await fetch('/api/videos/'+b.dataset.id,{method:'DELETE',headers:headers()}),x=await r.json();if(x.ok){toast('Видео удалено');await loadProfile(userId);await loadFeed(currentFeedMode)}else toast(x.detail||'Не удалось удалить')});
 if(!userId){$('editProfileBtn').onclick=()=>{openPanel('editProfilePanel');$('editBio').value=u.bio||''};$('savedOpenBtn').onclick=loadSaved;if(me?.is_admin){let ab=document.createElement('button');ab.className='secondary';ab.textContent='🛡 Открыть модерацию';ab.onclick=loadAdmin;$('profileContent').appendChild(ab)}}
 if(userId)$('profileFollow').onclick=async()=>{let r=await fetch('/api/users/'+userId+'/follow',{method:'POST',headers:headers()}),x=await r.json();if(x.ok){$('profileFollow').textContent=x.following?'Вы подписаны':'Подписаться';u.following=x.following}}}
async function openComments(id){openPanel('commentsPanel');$('commentsList').innerHTML='Загрузка…';let r=await fetch('/api/videos/'+id+'/comments',{headers:headers()}),d=await r.json();if(!r.ok||!d.ok){$('commentsList').innerHTML='<div class="status">Не удалось загрузить комментарии.</div>';return}$('commentsList').innerHTML=(d.comments||[]).map(c=>`<div class="comment"><div>${c.avatar_url?`<img class="avatar" src="${esc(c.avatar_url)}">`:'<div class="avatar"></div>'}</div><div style="flex:1"><b>@${esc(c.username||c.first_name||'user')}</b><p>${esc(c.text)}</p><div class="status">${new Date(c.created_at).toLocaleString()}</div></div>${me&&Number(me.id)===Number(c.user_id)?`<button class="icon delete-comment" data-id="${c.id}" aria-label="Удалить">×</button>`:''}</div>`).join('')||'<div class="status">Пока нет комментариев.</div>';document.querySelectorAll('.delete-comment').forEach(b=>b.onclick=async()=>{let r=await fetch('/api/comments/'+b.dataset.id,{method:'DELETE',headers:headers()}),x=await r.json();if(x.ok){toast('Комментарий удалён');openComments(id)}})}
async function loadSaved(){openPanel('savedPanel');$('savedList').innerHTML='Загрузка…';let r=await fetch('/api/saved',{headers:headers()}),d=await r.json();if(!r.ok||!d.ok){$('savedList').innerHTML='<div class="status">Не удалось загрузить сохранённые видео.</div>';return}$('savedList').innerHTML=(d.videos||[]).map(v=>`<div class="result"><video src="${esc(v.video_url)}" muted playsinline controls preload="metadata" style="width:58px;height:78px;object-fit:cover;border-radius:9px"></video><div><b>${esc(v.caption||'Без описания')}</b><div class="status">@${esc(v.username||v.first_name||'user')} · ${v.views_count} просмотров</div><div>${hashtagHtml(v.hashtags)}</div></div></div>`).join('')||'<div class="status">Пока нет сохранённых видео.</div>'}
async function loadPeople(userId,type){openPanel('peoplePanel');$('peopleTitle').textContent=type==='followers'?'Подписчики':'Подписки';$('peopleList').innerHTML='Загрузка…';let r=await fetch('/api/users/'+userId+'/'+type,{headers:headers()}),d=await r.json();if(!r.ok||!d.ok){$('peopleList').innerHTML='<div class="status">Не удалось загрузить список.</div>';return}$('peopleList').innerHTML=(d.users||[]).map(u=>`<div class="people-row">${u.avatar_url?`<img class="avatar" src="${esc(u.avatar_url)}">`:'<div class="avatar"></div>'}<div><b>@${esc(u.username||u.first_name||'user')}</b><div class="status">${esc(((u.first_name||'')+' '+(u.last_name||'')).trim())}</div></div>${Number(u.id)!==Number(me.id)?`<button class="secondary people-follow" data-user="${u.id}" style="width:auto;margin:0">${u.following?'Вы подписаны':'Подписаться'}</button>`:''}</div>`).join('')||'<div class="status">Список пуст.</div>';document.querySelectorAll('.people-follow').forEach(b=>b.onclick=async()=>{let r=await fetch('/api/users/'+b.dataset.user+'/follow',{method:'POST',headers:headers()}),x=await r.json();if(x.ok){b.textContent=x.following?'Вы подписаны':'Подписаться'}})}
async function search(){let q=$('searchInput').value.trim();if(!q){$('searchResults').innerHTML='';return}let r=await fetch('/api/search?q='+encodeURIComponent(q),{headers:headers()}),d=await r.json();if(!r.ok||!d.ok){$('searchResults').innerHTML='<div class="status">Ошибка поиска.</div>';return}$('searchResults').innerHTML=(d.hashtags||[]).map(h=>`<button class="secondary hashtag-result" data-tag="${esc(h.tag)}" style="text-align:left">#${esc(h.tag)} · ${h.videos_count} видео</button>`).join('')+(d.users||[]).map(u=>`<div class="result"><button class="avatar" data-user="${u.id}" style="padding:0;border:0;overflow:hidden">${u.avatar_url?`<img class="avatar" src="${esc(u.avatar_url)}">`:''}</button><div><b>@${esc(u.username||u.first_name||'user')}</b><div class="status">${u.followers_count} подписчиков</div></div><button data-user="${u.id}" class="find-follow">Подписаться</button></div>`).join('')+(d.videos||[]).map(v=>`<div class="result"><div><b>${esc(v.caption||'Видео')}</b><div class="status">@${esc(v.username||v.first_name||'user')} · ${v.views_count} просмотров</div></div></div>`).join('')||'<div class="status">Ничего не найдено.</div>';document.querySelectorAll('.find-follow').forEach(b=>b.onclick=async()=>{let r=await fetch('/api/users/'+b.dataset.user+'/follow',{method:'POST',headers:headers()}),x=await r.json();if(x.ok)b.textContent=x.following?'Вы подписаны':'Подписаться'});document.querySelectorAll('.hashtag-result').forEach(b=>b.onclick=()=>{$('searchInput').value='#'+b.dataset.tag;search()})}
async function loadAdmin(){openPanel('adminPanel');$('adminContent').innerHTML='Загрузка…';let r=await fetch('/api/admin/reports',{headers:headers()}),d=await r.json();if(!r.ok||!d.ok){$('adminContent').innerHTML='<div class="status">'+esc(d.detail||'Нет доступа')+'</div>';return}if(!d.reports.length){$('adminContent').innerHTML='<div class="status">Открытых жалоб нет.</div>';return}$('adminContent').innerHTML=d.reports.map(x=>`<div class="admin-item"><b>#${x.id} · ${esc(x.reason)}</b><div class="status">Видео #${x.video_id} · @${esc(x.reporter_username||'user')} · ${new Date(x.created_at).toLocaleString()}</div><div>${esc(x.details||'Без комментария')}</div><div class="admin-actions"><button class="secondary admin-resolve" data-id="${x.id}">Закрыть жалобу</button><button class="secondary danger admin-hide" data-id="${x.video_id}">Скрыть видео</button></div></div>`).join('');document.querySelectorAll('.admin-resolve').forEach(b=>b.onclick=async()=>{let x=await fetch('/api/admin/reports/'+b.dataset.id+'/resolve',{method:'POST',headers:headers()}),j=await x.json();if(j.ok){toast('Жалоба закрыта');loadAdmin()}});document.querySelectorAll('.admin-hide').forEach(b=>b.onclick=async()=>{if(!confirm('Скрыть видео из ленты?'))return;let x=await fetch('/api/admin/videos/'+b.dataset.id+'/hide',{method:'POST',headers:headers()}),j=await x.json();if(j.ok){toast('Видео скрыто');loadAdmin();loadFeed(currentFeedMode)}})}
async function notifications(){openPanel('notifyPanel');let r=await fetch('/api/notifications',{headers:headers()}),d=await r.json();let map={follow:'подписался(ась) на вас',comment:'оставил(а) комментарий к вашему видео'};$('notifyList').innerHTML=(d.notifications||[]).map(n=>`<div class="result">${n.avatar_url?`<img class="avatar" src="${esc(n.avatar_url)}">`:'<div class="avatar"></div>'}<div><b>@${esc(n.username||n.first_name||'user')}</b><div class="status">${map[n.type]||'новая активность'}</div></div></div>`).join('')||'<div class="status">Пока нет новых событий.</div>';updateUnread()}
async function updateUnread(){try{let r=await fetch('/api/notifications/unread-count',{headers:headers()}),d=await r.json();let n=$('notifyBadge');if(d.ok&&d.count>0){n.textContent=d.count>9?'9+':d.count;n.style.display='block'}else n.style.display='none'}catch(_){} }
$('feed').addEventListener('scroll',loadMoreIfNeeded,{passive:true});
document.querySelectorAll('.panel-close').forEach(b=>b.onclick=closePanels);document.querySelectorAll('.panel').forEach(p=>p.addEventListener('click',e=>{if(e.target===p)closePanels()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});if(tg?.BackButton)tg.BackButton.onClick(closePanels);
$('uploadBtn').onclick=()=>openPanel('uploadPanel');$('profileBtn').onclick=async()=>{openPanel('profilePanel');try{await loadProfile()}catch(e){$('profileContent').textContent=e.message}};$('searchBtn').onclick=()=>openPanel('searchPanel');$('searchGo').onclick=search;$('recommendedTab').onclick=()=>loadFeed('recommended');$('followingTab').onclick=()=>loadFeed('following');document.querySelectorAll('.report-option').forEach(b=>b.onclick=()=>{currentReportReason=b.dataset.reason;document.querySelectorAll('.report-option').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('reportSend').onclick=async()=>{if(!currentReportVideo||!currentReportReason){toast('Выберите причину');return}let r=await fetch('/api/videos/'+currentReportVideo+'/report',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({reason:currentReportReason,details:$('reportDetails').value.trim()})}),d=await r.json();if(d.ok){closePanels();$('reportDetails').value='';toast('Жалоба отправлена')}else toast(d.detail||'Не удалось отправить жалобу')};$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('commentSend').onclick=async()=>{let t=$('commentInput').value.trim();if(!t||!currentCommentVideo)return;let r=await fetch('/api/videos/'+currentCommentVideo+'/comments',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({text:t})}),d=await r.json();if(d.ok){$('commentInput').value='';await openComments(currentCommentVideo);toast('Комментарий добавлен')}};
$('publishBtn').onclick=async()=>{let file=$('videoFile').files[0],status=$('uploadStatus');if(!file){status.textContent='Выберите видео.';return}if(file.size>50*1024*1024){status.textContent='Максимальный размер — 50 МБ.';return}let f=new FormData();f.append('video',file);f.append('caption',$('caption').value.trim());$('publishBtn').disabled=true;status.textContent='Загрузка…';try{let r=await fetch('/api/videos/upload',{method:'POST',headers:headers(),body:f}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.detail||'Ошибка загрузки');closePanels();$('videoFile').value='';$('caption').value='';await loadFeed(currentFeedMode);toast(d.video?.caption?'Видео опубликовано':'Видео опубликовано без описания')}catch(e){status.textContent=e.message}finally{$('publishBtn').disabled=false}};
$('saveProfileBtn').onclick=async()=>{let bio=$('editBio').value.trim();$('saveProfileBtn').disabled=true;$('profileSaveStatus').textContent='Сохраняем…';try{let r=await fetch('/api/me',{method:'PATCH',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({bio})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.detail||'Не удалось сохранить');me={...me,...d.user};$('profileSaveStatus').textContent='Сохранено';toast('Профиль обновлён');setTimeout(()=>{closePanels();$('profileBtn').click()},350)}catch(e){$('profileSaveStatus').textContent=e.message}finally{$('saveProfileBtn').disabled=false}};
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let n=b.dataset.nav;if(n==='home')closePanels();if(n==='search')openPanel('searchPanel');if(n==='profile')$('profileBtn').click();if(n==='notify')notifications()});
(async()=>{try{await auth();await loadFeed('recommended');await updateUnread()}catch(e){feed.innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'}})();
</script></body></html>
