<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Telegram Shorts</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{position:relative;width:100%;max-width:520px;height:100%;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 35%,#242424 0,#111 38%,#080808 72%)}.top{position:absolute;z-index:3;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 16px) 18px 16px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#080808cc,transparent)}.logo{font-size:20px;font-weight:800}.status{padding:7px 10px;border-radius:999px;background:#ffffff18;font-size:12px;color:#ddd}.video{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.play{width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff18;border:1px solid #ffffff30;font-size:30px}.message{position:absolute;left:18px;right:78px;bottom:100px}.message h1{margin:0 0 8px;font-size:22px}.message p{margin:0;color:#bdbdbd;line-height:1.45}.actions{position:absolute;right:14px;bottom:105px;display:flex;flex-direction:column;gap:15px}.action{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff16;border:1px solid #ffffff20;font-size:21px}.bottom{position:absolute;z-index:3;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);height:62px;border-radius:20px;display:flex;align-items:center;justify-content:space-around;background:#111111dd;border:1px solid #ffffff18}.nav{text-align:center;color:#aaa;font-size:11px}.nav.active{color:#fff}.nav-icon{font-size:21px}.user{position:absolute;z-index:4;left:18px .user.first_name||('@'+(d.user.username||'Пользователь'));if(d.user.photo_url)avatar.src=d.user.photo_url;user.style.display='flex'}catch(e){status.textContent='Ошибка';error.textContent=e.message;error.style.display='block'}}auth();</script></body></html>
